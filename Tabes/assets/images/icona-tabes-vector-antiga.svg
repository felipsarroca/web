<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Icona de les tabes</title>
  <desc id="desc">Una taba central molt visible envoltada de tres peces secundàries sobre un fons càlid i contrastat.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4db"/>
      <stop offset="55%" stop-color="#ffd680"/>
      <stop offset="100%" stop-color="#f6a46d"/>
    </linearGradient>
    <linearGradient id="boneMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffef8"/>
      <stop offset="48%" stop-color="#f3e0bb"/>
      <stop offset="100%" stop-color="#ddb57b"/>
    </linearGradient>
    <linearGradient id="boneSoft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff9eb"/>
      <stop offset="100%" stop-color="#e5c089"/>
    </linearGradient>
    <linearGradient id="groove" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b9854d"/>
      <stop offset="100%" stop-color="#8f5f35"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#7a4e2f" flood-opacity="0.22"/>
    </filter>
    <path id="tabaShape" d="M-54,-20c0,-25 20,-45 46,-45 14,0 27,6 36,17 8,10 14,12 25,12 13,0 20,-3 29,-10 8,-6 18,-10 31,-10 27,0 48,20 48,45 0,17 -10,31 -25,39 17,8 28,24 28,42 0,27 -23,48 -52,48 -11,0 -21,-3 -30,-10 -8,-6 -15,-8 -29,-8 -12,0 -21,2 -30,8 -9,6 -20,10 -31,10 -28,0 -51,-21 -51,-48 0,-18 10,-33 28,-42 -15,-8 -23,-22 -23,-38z"/>
    <path id="grooveShape" d="M-18,-15c11,-11 31,-11 42,0 8,8 8,20 0,28-11,11 -31,11 -42,0-8,-8 -8,-20 0,-28z"/>
  </defs>
  <rect width="512" height="512" rx="122" fill="url(#bg)"/>
  <g opacity="0.28">
    <circle cx="118" cy="110" r="56" fill="#fff4d0"/>
    <circle cx="406" cy="132" r="44" fill="#ffd1b9"/>
    <circle cx="406" cy="388" r="60" fill="#ffe08f"/>
  </g>
  <g filter="url(#shadow)">
    <g transform="translate(256 256) rotate(-11) scale(1.18)">
      <use href="#tabaShape" fill="url(#boneMain)"/>
      <use href="#grooveShape" fill="url(#groove)"/>
      <ellipse cx="30" cy="-7" rx="31" ry="14" fill="#fff9ee" opacity="0.82"/>
    </g>
    <g transform="translate(136 166) rotate(-18) scale(0.58)">
      <use href="#tabaShape" fill="url(#boneSoft)"/>
      <use href="#grooveShape" fill="url(#groove)"/>
    </g>
    <g transform="translate(378 164) rotate(17) scale(0.56)">
      <use href="#tabaShape" fill="url(#boneSoft)"/>
      <use href="#grooveShape" fill="url(#groove)"/>
    </g>
    <g transform="translate(374 362) rotate(-14) scale(0.62)">
      <use href="#tabaShape" fill="url(#boneSoft)"/>
      <use href="#grooveShape" fill="url(#groove)"/>
    </g>
  </g>
</svg>
