<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Mapa interactiu del Modernisme a Barcelona i Terrassa, amb fitxes i imatges de cada edifici.">
    <title>Mapa | El Modernisme</title>
    <meta property="og:type" content="website">
    <meta property="og:locale" content="ca_ES">
    <meta property="og:site_name" content="El Modernisme">
    <meta property="og:title" content="Mapa | El Modernisme">
    <meta property="og:description" content="Mapa interactiu del Modernisme a Barcelona i Terrassa, amb fitxes i imatges de cada edifici.">
    <meta property="og:url" content="https://felipsarroca.github.io/web/Modernisme/mapa.html">
    <meta property="og:image" content="https://felipsarroca.github.io/web/Modernisme/img/mitjana/casa-mila.webp">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="stylesheet" href="fonts/fonts.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <link rel="stylesheet" href="style.css?v=4">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="assets/icona-192.png">
    <meta name="theme-color" content="#5c4a3d">
</head>
<body>
    <a class="skip-link" href="#contingut">Salta al contingut principal</a>
    <nav class="nav-principal"></nav>

    <header class="header-seccio header-compacte">
        <p class="avantitol">Explora</p>
        <h1>Mapa del Modernisme</h1>
        <p class="subtitol">De Barcelona i Terrassa a Girona, Reus i més enllà</p>
    </header>

    <main id="contingut" class="contingut-principal">
        <section class="seccio">
            <div class="filtres" role="group" aria-label="Tria la ciutat">
                <span class="etiqueta-filtre">Ciutat:</span>
                <button type="button" class="xip" data-ciutat="totes" aria-pressed="false">Tots</button>
                <button type="button" class="xip" data-ciutat="barcelona" aria-pressed="true">Barcelona</button>
                <button type="button" class="xip" data-ciutat="terrassa" aria-pressed="false">Terrassa</button>
                <button type="button" class="xip" data-ciutat="catalunya" aria-pressed="false">Resta de Catalunya</button>
                <button type="button" class="xip" data-ciutat="fora" aria-pressed="false">Fora de Catalunya</button>
                <span class="recompte"><a href="terrassa.html">Fes l'itinerari per Terrassa →</a></span>
            </div>
            <div class="filtres" role="group" aria-label="Tria la vida d'un arquitecte">
                <span class="etiqueta-filtre">Vida d'un arquitecte:</span>
                <button type="button" class="xip" data-vida="gaudi" aria-pressed="false">Gaudí</button>
                <button type="button" class="xip" data-vida="domenech" aria-pressed="false">Domènech i Montaner</button>
                <button type="button" class="xip" data-vida="puig" aria-pressed="false">Puig i Cadafalch</button>
                <button type="button" class="xip" data-vida="muncunill" aria-pressed="false">Muncunill</button>
                <span class="recompte"><a href="arquitectes.html">Els grans arquitectes →</a></span>
            </div>
            <p class="avis-vida" id="avis-vida" hidden></p>
            <div class="mapa-disposicio">
                <nav class="llista-llocs" aria-label="Llista d'edificis"><ol id="llista-llocs"></ol></nav>
                <div id="mapa" role="region" aria-label="Mapa interactiu"></div>
            </div>
            <p class="peu-foto">Dades del mapa: © col·laboradors d'OpenStreetMap. Coordenades: Wikidata.</p>
        </section>
    </main>

    <script src="dades/imatges.js?v=4"></script>
    <script src="dades/glossari.js?v=4"></script>
    <script src="dades/obres.js?v=4"></script>
    <script src="dades/arquitectes.js?v=4"></script>
    <script src="js/comu.js?v=4"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="js/mapa.js?v=4"></script>
</body>
</html>
