<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Mapa interactiu del Modernisme a Barcelona i Terrassa, amb fitxes i imatges de cada edifici.">
    <title>Mapa | El Modernisme</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Playfair+Display:wght@600;700&display=swap">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body>
    <a class="skip-link" href="#contingut">Salta al contingut principal</a>
    <nav class="nav-principal"></nav>

    <header class="header-seccio header-compacte">
        <p class="avantitol">Explora</p>
        <h1>Mapa del Modernisme</h1>
        <p class="subtitol">Barcelona i Terrassa, edifici a edifici</p>
    </header>

    <main id="contingut" class="contingut-principal">
        <section class="seccio">
            <div class="filtres" role="group" aria-label="Tria la ciutat">
                <span class="etiqueta-filtre">Ciutat:</span>
                <button type="button" class="xip" data-ciutat="totes" aria-pressed="false">Totes dues</button>
                <button type="button" class="xip" data-ciutat="barcelona" aria-pressed="true">Barcelona</button>
                <button type="button" class="xip" data-ciutat="terrassa" aria-pressed="false">Terrassa</button>
                <span class="recompte"><a href="terrassa.html">Fes l'itinerari per Terrassa →</a></span>
            </div>
            <div class="mapa-disposicio">
                <nav class="llista-llocs" aria-label="Llista d'edificis"><ol id="llista-llocs"></ol></nav>
                <div id="mapa" role="region" aria-label="Mapa interactiu"></div>
            </div>
            <p class="peu-foto">Dades del mapa: © col·laboradors d'OpenStreetMap. Coordenades: Wikidata.</p>
        </section>
    </main>

    <script src="dades/imatges.js"></script>
    <script src="dades/glossari.js"></script>
    <script src="dades/obres.js"></script>
    <script src="js/comu.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="js/mapa.js"></script>
</body>
</html>
