name: La Revolució Industrial
description: Comunica un error o proposa una millora del web interactiu.
title: "[Revolució Industrial] "
body:
  - type: dropdown
    id: tipus
    attributes:
      label: Tipus
      options:
        - Error històric o tècnic
        - Error de funcionament
        - Suggeriment didàctic
        - Dubte
    validations:
      required: true
  - type: textarea
    id: descripcio
    attributes:
      label: Descripció
      description: Explica què passa o què t'agradaria millorar.
    validations:
      required: true
  - type: input
    id: capitol
    attributes:
      label: Capítol i fase
      placeholder: Newcomen → Watt, fase 2
  - type: textarea
    id: passos
    attributes:
      label: Passos per reproduir-ho
      description: Omple-ho si es tracta d'un error de funcionament.
  - type: input
    id: dispositiu
    attributes:
      label: Dispositiu i navegador
      placeholder: Portàtil amb Chrome, mòbil amb Safari...
