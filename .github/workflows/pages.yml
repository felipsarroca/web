name: Publica les webs a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Asturies-Navarra/package-lock.json

      - name: Instal·la les dependències
        working-directory: Asturies-Navarra
        run: npm ci

      - name: Compila Asturies-Navarra
        working-directory: Asturies-Navarra
        run: npx next build

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Instal·la les dependències del Renaixement
        working-directory: Renaixement
        run: bun install --frozen-lockfile

      - name: Comprova el Renaixement
        working-directory: Renaixement
        run: bun run test

      - name: Compila el Renaixement per a GitHub Pages
        working-directory: Renaixement
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_SITE_URL: https://felipsarroca.github.io/web/Renaixement/
        run: bun run build:pages

      - name: Prepara el lloc complet
        run: |
          mkdir _site
          git archive HEAD | tar -x -C _site
          rm -rf _site/Asturies-Navarra
          mv Asturies-Navarra/out _site/Asturies-Navarra
          rm -rf _site/Renaixement
          mv Renaixement/out _site/Renaixement
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publica a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
